<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .content-section { display: none; }
        .sidebar-link.active {
            background-color: #2563eb; 
            color: white;
        }
        #message-modal {
            transition: opacity 0.3s ease;
        }
        #message-modal > div {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Firebase App -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            collection,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        // *** ഉപയോക്താവ് നൽകിയ പുതിയ കോൺഫിഗറേഷൻ ചേർത്തു ***
        const firebaseConfig = {
          apiKey: "AIzaSyDToRcrQc-P4zMmbzyUt96YXcoQPg9FilA",
          authDomain: "online-shopping-da4fd.firebaseapp.com",
          projectId: "online-shopping-da4fd",
          storageBucket: "online-shopping-da4fd.firebasestorage.app",
          messagingSenderId: "754480682343",
          appId: "1:754480682343:web:9d98db77b35a480c8c4bc2"
        };
        
        // --- ഹോസ്റ്റിംഗിനായി കോഡ് അപ്ഡേറ്റ് ചെയ്തു ---
        const effectiveConfig = firebaseConfig;
        const appId = firebaseConfig.projectId; // projectId ഉപയോഗിക്കുന്നു
        const initialAuthToken = null; // ഹോസ്റ്റ് ചെയ്യുമ്പോൾ ഇത് ഉണ്ടാകില്ല

        let app, db, auth, userId;
        let productsCol, categoriesCol;

        // --- UI Elements ---
        const loginStatus = document.getElementById('login-status');
        const adminWrapper = document.getElementById('admin-wrapper');
        const userIdDisplay = document.getElementById('user-id-display');
        
        const productForm = document.getElementById('product-form');
        const productList = document.getElementById('product-list');
        const productFormTitle = document.getElementById('product-form-title');
        
        const categoryForm = document.getElementById('category-form');
        const categoryList = document.getElementById('category-list');
        const categoryFormTitle = document.getElementById('category-form-title');

        // --- Initialization ---
        function initializeFirebase() {
            try {
                if (!effectiveConfig.apiKey) {
                    throw new Error("Firebase config is missing.");
                }
                app = initializeApp(effectiveConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('Debug'); 
                
                setupAuthListener();

            } catch (e) {
                console.error("Firebase initialization failed:", e);
                loginStatus.textContent = "Error: Could not connect. Check Firebase Config.";
            }
        }

        // --- Authentication ---
        function setupAuthListener() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("User is authenticated:", userId);
                    userIdDisplay.textContent = userId;
                    loginStatus.classList.add('hidden');
                    adminWrapper.classList.remove('hidden');
                    
                    setupCollections();
                    loadProducts();
                    loadCategories();
                    showSection('products-section');

                } else {
                    console.log("No user. Attempting anonymous sign in...");
                    adminWrapper.classList.add('hidden');
                    loginStatus.classList.remove('hidden');
                    
                    try {
                        await signInAnonymously(auth); 
                        console.log("Signed in anonymously for admin actions.");
                    } catch (error) {
                        console.error("Sign-in failed:", error);
                        loginStatus.textContent = "Authentication Failed. Please refresh.";
                    }
                }
            });
        }

        // --- Firestore Collection Setup ---
        function setupCollections() {
            if (!appId) {
                console.error("appId is not set.");
                return;
            }
            const publicDataPath = `artifacts/${appId}/public/data`;
            productsCol = collection(db, `${publicDataPath}/products`);
            categoriesCol = collection(db, `${publicDataPath}/categories`);
            console.log("Data path set to:", publicDataPath);
        }

        // --- Product Management (CRUD) ---
        
        function loadProducts() {
            if (!productsCol) return;
            onSnapshot(productsCol, (snapshot) => {
                productList.innerHTML = ''; 
                if (snapshot.empty) {
                    productList.innerHTML = '<p class="text-gray-500">No products found.</p>';
                    return;
                }
                snapshot.forEach((doc) => {
                    renderProduct(doc.data(), doc.id);
                });
            }, (error) => {
                console.error("Error loading products:", error);
                showMessage("Error loading products.");
            });
        }

        function renderProduct(data, id) {
            const productHtml = `
                <div class="bg-white p-4 rounded-lg shadow-md flex items-center space-x-4">
                    <img src="${data.image || 'https://placehold.co/64x64/EBF4FF/3B82F6?text=Img'}" alt="${data.name}" class="w-16 h-16 rounded-lg object-cover" onerror="this.src='https://placehold.co/64x64/EBF4FF/3B82F6?text=Img'">
                    <div class="flex-grow">
                        <p class="font-semibold text-gray-800">${data.name}</p>
                        <p class="text-sm text-gray-600">₹${data.price}</p>
                    </div>
                    <div class="flex-shrink-0 flex space-x-2">
                        <button class="edit-product text-blue-600 hover:text-blue-800"
                            data-id="${id}"
                            data-name="${data.name}"
                            data-desc="${data.description}"
                            data-price="${data.price}"
                            data-image="${data.image}">
                            Edit
                        </button>
                        <button class="delete-product text-red-600 hover:text-red-800" data-id="${id}">
                            Delete
                        </button>
                    </div>
                </div>
            `;
            productList.insertAdjacentHTML('beforeend', productHtml);
        }

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const productId = e.target.dataset.id;
            const product = {
                name: productForm.productName.value,
                description: productForm.productDesc.value,
                price: productForm.productPrice.value,
                image: productForm.productImage.value,
            };

            try {
                if (productId) {
                    const docRef = doc(db, productsCol.path, productId);
                    await updateDoc(docRef, product);
                    showMessage("Product updated successfully!");
                } else {
                    await addDoc(productsCol, product);
                    showMessage("Product added successfully!");
                }
                clearProductForm();
            } catch (error) {
                console.error("Error saving product:", error);
                showMessage("Error saving product. Check console.");
            }
        });

        productList.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-product')) {
                const btn = e.target;
                productForm.productName.value = btn.dataset.name;
                productForm.productDesc.value = btn.dataset.desc;
                productForm.productPrice.value = btn.dataset.price;
                productForm.productImage.value = btn.dataset.image;
                productForm.dataset.id = btn.dataset.id; 
                productFormTitle.textContent = "Edit Product";
                window.scrollTo(0, 0);
            }
            if (e.target.classList.contains('delete-product')) {
                const id = e.target.dataset.id;
                deleteProduct(id);
            }
        });

        async function deleteProduct(id) {
            try {
                await deleteDoc(doc(db, productsCol.path, id));
                showMessage("Product deleted.");
            } catch (error) {
                console.error("Error deleting product:", error);
                showMessage("Error deleting product.");
            }
        }
        
        function clearProductForm() {
            productForm.reset();
            productForm.dataset.id = '';
            productFormTitle.textContent = "Add New Product";
        }
        document.getElementById('clear-product-form').addEventListener('click', clearProductForm);

        // --- Category Management (CRUD) ---
        
        function loadCategories() {
            if (!categoriesCol) return;
            onSnapshot(categoriesCol, (snapshot) => {
                categoryList.innerHTML = ''; 
                if (snapshot.empty) {
                    categoryList.innerHTML = '<p class="text-gray-500">No categories found.</p>';
                    return;
                }
                snapshot.forEach((doc) => {
                    renderCategory(doc.data(), doc.id);
                });
            }, (error) => {
                console.error("Error loading categories:", error);
            });
        }

        function renderCategory(data, id) {
            const categoryHtml = `
                <div class="bg-white p-4 rounded-lg shadow-md flex items-center space-x-4">
                    <img src="${data.image || 'https://placehold.co/64x64/EBF4FF/3B82F6?text=Img'}" alt="${data.name}" class="w-16 h-16 rounded-full object-cover" onerror="this.src='https://placehold.co/64x64/EBF4FF/3B82F6?text=Img'">
                    <div class="flex-grow">
                        <p class="font-semibold text-gray-800">${data.name}</p>
                    </div>
                    <div class="flex-shrink-0 flex space-x-2">
                        <button class="edit-category text-blue-600 hover:text-blue-800"
                            data-id="${id}"
                            data-name="${data.name}"
                            data-image="${data.image}">
                            Edit
                        </button>
                        <button class="delete-category text-red-600 hover:text-red-800" data-id="${id}">
                            Delete
                        </button>
                    </div>
                </div>
            `;
            categoryList.insertAdjacentHTML('beforeend', categoryHtml);
        }

        categoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const categoryId = e.target.dataset.id;
            const category = {
                name: categoryForm.categoryName.value,
                image: categoryForm.categoryImage.value,
            };

            try {
                if (categoryId) {
                    await updateDoc(doc(db, categoriesCol.path, categoryId), category);
                    showMessage("Category updated!");
                } else {
                    await addDoc(categoriesCol, category);
                    showMessage("Category added!");
                }
                clearCategoryForm();
            } catch (error) {
                console.error("Error saving category:", error);
                showMessage("Error saving category.");
            }
        });

        categoryList.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-category')) {
                const btn = e.target;
                categoryForm.categoryName.value = btn.dataset.name;
                categoryForm.categoryImage.value = btn.dataset.image;
                categoryForm.dataset.id = btn.dataset.id;
                categoryFormTitle.textContent = "Edit Category";
            }
            if (e.target.classList.contains('delete-category')) {
                deleteCategory(e.target.dataset.id);
            }
        });

        async function deleteCategory(id) {
            try {
                await deleteDoc(doc(db, categoriesCol.path, id));
                showMessage("Category deleted.");
            } catch (error) {
                console.error("Error deleting category:", error);
                showMessage("Error deleting category.");
            }
        }

        function clearCategoryForm() {
            categoryForm.reset();
            categoryForm.dataset.id = '';
            categoryFormTitle.textContent = "Add New Category";
        }
        document.getElementById('clear-category-form').addEventListener('click', clearCategoryForm);

        // --- Navigation ---
        const sidebarLinks = document.querySelectorAll('.sidebar-link');
        const contentSections = document.querySelectorAll('.content-section');

        function showSection(sectionId) {
            contentSections.forEach(section => {
                section.style.display = 'none';
            });
            sidebarLinks.forEach(link => {
                link.classList.remove('active');
            });

            const activeSection = document.getElementById(sectionId);
            if (activeSection) {
                activeSection.style.display = 'block';
            }
            const activeLink = document.querySelector(`.sidebar-link[onclick*="'${sectionId}'"]`);
            if (activeLink) {
                activeLink.classList.add('active');
            }
        }
        window.showSection = showSection;

        // --- Message Modal ---
        const modal = document.getElementById('message-modal');
        const modalText = document.getElementById('modal-text');
        
        function showMessage(message) {
            modalText.textContent = message;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function hideMessage() {
            modal.classList.remove('opacity-100');
            modal.querySelector('div').classList.remove('scale-100');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
        window.hideMessage = hideMessage;

        // --- Start Application ---
        initializeFirebase();
    </script>

    <!-- Loading / Auth Message -->
    <div id="login-status" class="flex items-center justify-center min-h-screen">
        <p class="text-lg font-medium text-gray-700">Connecting to Admin Panel...</p>
    </div>

    <!-- Admin Panel Wrapper (Hidden by default) -->
    <div id="admin-wrapper" class="hidden">
        <div class="flex flex-col md:flex-row min-h-screen">
            <!-- Sidebar -->
            <aside class="w-full md:w-64 bg-gray-800 text-gray-300 p-4 md:p-6 space-y-4">
                <h1 class="text-2xl font-bold text-white text-center md:text-left">Admin Panel</h1>
                <div class="text-xs text-center md:text-left">
                    <p>Logged in as:</p>
                    <p id="user-id-display" class="font-mono break-all"></p>
                </div>
                <nav class="space-y-2">
                    <a href="#" class="sidebar-link flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700" onclick="showSection('products-section')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>
                        <span>Products</span>
                    </a>
                    <a href="#" class="sidebar-link flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700" onclick="showSection('categories-section')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" /><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" /></svg>
                        <span>Categories</span>
                    </a>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 p-6 md:p-10">

                <!-- Products Section -->
                <section id="products-section" class="content-section space-y-6">
                    <h2 class="text-3xl font-bold text-gray-900">Manage Products</h2>
                    <!-- Add/Edit Product Form -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <form id="product-form" class="space-y-4" data-id="">
                            <h3 id="product-form-title" class="text-xl font-semibold mb-4">Add New Product</h3>
                            <div>
                                <label for="productName" class="block text-sm font-medium text-gray-700">Product Name</label>
                                <input type="text" id="productName" name="productName" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                            </div>
                            <div>
                                <label for="productDesc" class="block text-sm font-medium text-gray-700">Description</label>
                                <textarea id="productDesc" name="productDesc" rows="3" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label for="productPrice" class="block text-sm font-medium text-gray-700">Price (₹)</label>
                                    <input type="number" id="productPrice" name="productPrice" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label for="productImage" class="block text-sm font-medium text-gray-700">Image URL</label>
                                    <input type="url" id="productImage" name="productImage" required placeholder="https://placehold.co/300x300" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                </div>
                            </div>
                            <div class="flex space-x-4">
                                <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">Save Product</button>
                                <button type="button" id="clear-product-form" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-semibold hover:bg-gray-300 transition duration-300">Clear</button>
                            </div>
                        </form>
                    </div>
                    <!-- Product List -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <h3 class="text-xl font-semibold mb-4">Existing Products</h3>
                        <div id="product-list" class="space-y-3">
                            <!-- Products will be loaded here -->
                        </div>
                    </div>
                </section>

                <!-- Categories Section -->
                <section id="categories-section" class="content-section space-y-6">
                    <h2 class="text-3xl font-bold text-gray-900">Manage Categories</h2>
                    <!-- Add/Edit Category Form -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <form id="category-form" class="space-y-4" data-id="">
                            <h3 id="category-form-title" class="text-xl font-semibold mb-4">Add New Category</h3>
                            <div>
                                <label for="categoryName" class="block text-sm font-medium text-gray-700">Category Name</label>
                                <input type="text" id="categoryName" name="categoryName" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                            </div>
                            <div>
                                <label for="categoryImage" class="block text-sm font-medium text-gray-700">Image URL</label>
                                <input type="url" id="categoryImage" name="categoryImage" required placeholder="https://placehold.co/80x80" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                            </div>
                            <div class="flex space-x-4">
                                <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">Save Category</button>
                                <button type="button" id="clear-category-form" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-semibold hover:bg-gray-300 transition duration-300">Clear</button>
                            </div>
                        </form>
                    </div>
                    <!-- Category List -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <h3 class="text-xl font-semibold mb-4">Existing Categories</h3>
                        <div id="category-list" class="space-y-3">
                            <!-- Categories will be loaded here -->
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Message Modal -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm mx-auto text-center transform scale-95">
            <p id="modal-text" class="text-lg font-medium text-gray-800"></p>
            <button onclick="hideMessage()" class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">OK</button>
        </div>
    </div>

</body>
</html>
