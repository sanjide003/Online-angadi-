<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary-50: #eff6ff;
            --color-primary-100: #dbeafe;
            --color-primary-500: #6366F1; /* Indigo, സ്ക്രീൻഷോട്ടിലെ നിറത്തോട് സാമ്യമുള്ളത് */
            --color-primary-600: #4F46E5;
            --color-primary-700: #4338CA;
            --font-family: 'Inter', sans-serif;
        }
        body {
            font-family: var(--font-family);
            background-color: #f3f4f6; /* Light gray background */
        }
        .bg-primary-50 { background-color: var(--color-primary-50); }
        .bg-primary-100 { background-color: var(--color-primary-100); }
        .bg-primary-500 { background-color: var(--color-primary-500); }
        .bg-primary-600 { background-color: var(--color-primary-600); }
        .text-primary-600 { color: var(--color-primary-600); }
        .text-primary-700 { color: var(--color-primary-700); }
        .border-primary-500 { border-color: var(--color-primary-500); }
        .hover\:bg-primary-600:hover { background-color: var(--color-primary-600); }
        .hover\:bg-primary-700:hover { background-color: var(--color-primary-700); }
        
        /* പ്രധാന ഉള്ളടക്കത്തിന് താഴെയും മുകളിലും പാഡിംഗ് നൽകുന്നു */
        main {
            padding-top: 4rem; /* ഹെഡറിന്റെ ഉയരം */
            padding-bottom: 4rem; /* ബോട്ടം നാവിന്റെ ഉയരം */
        }
        .hidden { display: none; }

        /* ബോട്ടം നാവിഗേഷൻ */
        .bottom-nav {
            box-shadow: 0 -2px 6px rgba(0,0,0,0.05);
        }
        .nav-link {
            transition: all 0.2s ease-in-out;
            color: #6b7280; /* Gray-500 */
        }
        .nav-link.active {
            color: var(--color-primary-600);
            transform: scale(1.1);
        }
        .nav-link.active .nav-icon {
            color: var(--color-primary-600);
        }
        .nav-icon {
            width: 1.5rem; /* 24px */
            height: 1.5rem; /* 24px */
        }
        .nav-label {
            font-size: 0.75rem; /* 12px */
            font-weight: 500;
        }

        /* പ്രൊഡക്റ്റ് കാർഡ് (ഗ്രിഡ്) */
        .product-grid-card .chat-btn {
            background-color: #25D366; /* WhatsApp Green */
        }
        .product-grid-card .chat-btn:hover {
            background-color: #128C7E;
        }
        .product-grid-card .price-tag {
            background-color: rgba(0,0,0,0.5);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* പ്രൊഡക്റ്റ് ഫീഡ് കാർഡ് (ഹോം) */
        .product-feed-card .social-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: #6b7280;
        }
    </style>
</head>
<body class="antialiased">

    <!-- മുകളിലെ ഹെഡർ -->
    <header id="appHeader" class="bg-white shadow-sm fixed top-0 left-0 right-0 z-40 h-16 flex items-center justify-between px-4">
        <div class="flex items-center space-x-2">
            <!-- ലോഗോ -->
            <img id="headerIconImg" class="h-8 w-8 rounded-lg object-cover" src="https://placehold.co/40x40/6366F1/FFFFFF?text=S" alt="Logo" onerror="this.src='https://placehold.co/40x40/6366F1/FFFFFF?text=S'">
            <!-- ടൈറ്റിൽ -->
            <span id="headerTitle" class="text-xl font-bold text-gray-800">SocialShop</span>
        </div>
        <!-- പ്രൊഫൈൽ ഐക്കൺ -->
        <button class="text-gray-500 hover:text-primary-600" onclick="showPage('pageAccount')">
            <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </header>

    <!-- പ്രധാന ഉള്ളടക്കം മാറുന്ന ഭാഗം -->
    <main class="w-full max-w-2xl mx-auto px-4 py-4">

        <!-- പേജ് 1: ഹോം (ഫീഡ്) -->
        <div id="pageHome">
            <!-- സെർച്ച് ബാർ -->
            <div class="relative mb-4">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="Search products or categories..." class="w-full bg-white border border-gray-300 rounded-lg py-2.5 pl-10 pr-4 text-gray-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
            </div>

            <!-- പ്രൊഡക്റ്റ് ഫീഡ് -->
            <div id="productFeed" class="space-y-4">
                <!-- പ്രൊഡക്റ്റ് ഫീഡ് കാർഡുകൾ ഇവിടെ JS വഴി ചേർക്കും -->
            </div>
        </div>

        <!-- പേജ് 2: പ്രൊഡക്ടുകൾ (ഗ്രിഡ്) -->
        <div id="pageProducts" class="hidden">
            <!-- കാറ്റഗറി ഫിൽറ്ററുകൾ (ചിപ്സ്) -->
            <div id="categoryFilters" class="mb-4 flex items-center space-x-2 overflow-x-auto pb-2">
                <!-- കാറ്റഗറി ചിപ്സ് ഇവിടെ JS വഴി ചേർക്കും -->
            </div>

            <!-- പ്രൊഡക്റ്റ് ഗ്രിഡ് -->
            <div id="productList" class="grid grid-cols-2 gap-3 sm:gap-4">
                <!-- പ്രൊഡക്റ്റ് ഗ്രിഡ് കാർഡുകൾ ഇവിടെ JS വഴി ചേർക്കും -->
            </div>
        </div>

        <!-- പേജ് 3: അക്കൗണ്ട് -->
        <div id="pageAccount" class="hidden">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Account & Information</h1>
            
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <!-- ഇൻഫർമേഷൻ സെക്ഷൻ -->
                <div class="p-4">
                    <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Information</h2>
                    <div class="divide-y divide-gray-200">
                        <!-- About Us -->
                        <a href="#" id="infoLinkAbout" class="info-link flex justify-between items-center py-3" data-content-id="infoContentAbout">
                            <div class="flex items-center space-x-3">
                                <svg class="h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                                </svg>
                                <span class="text-gray-700 font-medium">About Us</span>
                            </div>
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
                            </svg>
                        </a>
                        <!-- Terms & Conditions -->
                        <a href="#" id="infoLinkTerms" class="info-link flex justify-between items-center py-3" data-content-id="infoContentTerms">
                            <div class="flex items-center space-x-3">
                                <svg class="h-6 w-6 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" />
                                </svg>
                                <span class="text-gray-700 font-medium">Terms & Conditions</span>
                            </div>
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
                            </svg>
                        </a>
                        <!-- Copyright -->
                        <a href="#" id="infoLinkCopyright" class="info-link flex justify-between items-center py-3" data-content-id="infoContentCopyright">
                            <div class="flex items-center space-x-3">
                                <svg class="h-6 w-6 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                                </svg>
                                <span class="text-gray-700 font-medium">Copyright</span>
                            </div>
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
                            </svg>
                        </a>
                    </div>
                </div>

                <!-- ഇൻഫർമേഷൻ കണ്ടന്റ് ഏരിയ -->
                <div class="p-4 bg-gray-50">
                    <h3 id="infoContentTitle" class="text-lg font-semibold text-gray-800 mb-2">About Us</h3>
                    <div id="infoContentBody" class="text-gray-600 space-y-2">
                        <p>Loading content...</p>
                    </div>
                </div>
            </div>

            <!-- ഫൂട്ടർ & യൂസർ ഐഡി -->
            <div class="mt-6 text-center text-gray-500 text-xs">
                <p id="footerText" class="mb-1">&copy; 2025 SocialShop. All rights reserved.</p>
                <p>Logged in as Guest: <span id="userIdDisplay" class="font-medium">Loading...</span></p>
            </div>
        </div>

    </main>

    <!-- താഴത്തെ നാവിഗേഷൻ ബാർ -->
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-gray-200 flex justify-around items-center z-40">
        <!-- ഹോം -->
        <a href="#" class="nav-link active flex flex-col items-center justify-center w-full" data-page="pageHome">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
            </svg>
            <span class="nav-label">Home</span>
        </a>
        <!-- പ്രൊഡക്ടുകൾ -->
        <a href="#" class="nav-link flex flex-col items-center justify-center w-full" data-page="pageProducts">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 8.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6A2.25 2.25 0 0115.75 3.75h2.25A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25A2.25 2.25 0 0113.5 8.25V6zM13.5 15.75A2.25 2.25 0 0115.75 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
            </svg>
            <span class="nav-label">Products</span>
        </a>
        <!-- അക്കൗണ്ട് -->
        <a href="#" class="nav-link flex flex-col items-center justify-center w-full" data-page="pageAccount">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <span class="nav-label">Account</span>
        </a>
    </nav>

    <!-- മെസ്സേജ് നോട്ടിഫിക്കേഷൻ -->
    <div id="messageBox" class="fixed bottom-20 right-5 z-50 hidden rounded-md p-4 shadow-lg text-white">
        <span id="messageText"></span>
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ഉപയോക്താവ് നൽകിയ ഫയർബേസ് കോൺഫിഗറേഷൻ
        const firebaseConfig = {
            apiKey: "AIzaSyCp-NKbL_kmB2nzlTv9fSisc2cVuE55p-Q",
            authDomain: "online-angadi-003.firebaseapp.com",
            projectId: "online-angadi-003",
            storageBucket: "online-angadi-003.firebasestorage.app",
            messagingSenderId: "873906876645",
            appId: "1:873906876645:web:a730abef1e07da515f640c",
            measurementId: "G-GH1DZXR5ZP"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'social-shop-default';

        let app, auth, db, currentUserId;
        let contentRef, themeRef, categoriesRef, productsRef;
        
        let allProducts = [];
        let allCategories = [];
        let appContent = {};
        let currencySymbol = '₹'; // സ്ക്രീൻഷോട്ട് അനുസരിച്ച്

        // DOM എലമെന്റുകൾ
        const $headerTitle = document.getElementById('headerTitle');
        const $headerIconImg = document.getElementById('headerIconImg');
        const $footerText = document.getElementById('footerText');
        const $userIdDisplay = document.getElementById('userIdDisplay');
        
        const $productFeed = document.getElementById('productFeed');
        const $productList = document.getElementById('productList');
        const $categoryFilters = document.getElementById('categoryFilters');
        
        const $messageBox = document.getElementById('messageBox');
        const $messageText = document.getElementById('messageText');

        // പേജുകൾ
        const $pages = {
            pageHome: document.getElementById('pageHome'),
            pageProducts: document.getElementById('pageProducts'),
            pageAccount: document.getElementById('pageAccount')
        };

        // അക്കൗണ്ട് പേജ് എലമെന്റുകൾ
        const $infoLinks = document.querySelectorAll('.info-link');
        const $infoContentTitle = document.getElementById('infoContentTitle');
        const $infoContentBody = document.getElementById('infoContentBody');

        // നാവിഗേഷൻ ലിങ്കുകൾ
        const $navLinks = document.querySelectorAll('.nav-link');

        // --- Init ---
        function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                // setLogLevel('debug');
                setupAuthListener();
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                showMessage("App failed to load. Check console.", 'error');
            }
        }

        // --- AUTH ---
        function setupAuthListener() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUserId = user.uid;
                    $userIdDisplay.textContent = currentUserId;
                    setupCollectionRefs();
                    loadInitialData();
                } else {
                    currentUserId = null;
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Firebase Authentication Error:", error);
                        showMessage(`Authentication failed: ${error.message}`, 'error');
                    }
                }
            });
        }

        // --- COLLECTION REFS ---
        function setupCollectionRefs() {
            if (!db || !appId || !currentUserId) return;
            const publicDataPath = `artifacts/${appId}/public/data`;
            contentRef = doc(db, `${publicDataPath}/content/main`);
            themeRef = doc(db, `${publicDataPath}/theme/main`);
            categoriesRef = collection(db, `${publicDataPath}/categories`);
            productsRef = collection(db, `${publicDataPath}/products`);
        }

        // --- DATA LOADING (REALTIME) ---
        function loadInitialData() {
            if (!db) return;

            // 1. ഹെഡർ, ഫൂട്ടർ, അക്കൗണ്ട് പേജ് കണ്ടന്റ്, കറൻസി
            onSnapshot(contentRef, (docSnap) => {
                if (docSnap.exists()) {
                    appContent = docSnap.data();
                    renderContent(appContent);
                    renderAccountPage(); // അക്കൗണ്ട് പേജ് അപ്ഡേറ്റ് ചെയ്യുന്നു
                } else {
                    console.log("No content data found. Using defaults.");
                }
            }, (err) => console.error("Error loading content:", err));

            // 2. തീം (നിറങ്ങളും ഫോണ്ടും)
            onSnapshot(themeRef, (docSnap) => {
                if (docSnap.exists()) {
                    applyTheme(docSnap.data());
                }
            }, (err) => console.error("Error loading theme:", err));

            // 3. കാറ്റഗറികൾ
            onSnapshot(query(categoriesRef), (snapshot) => {
                allCategories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCategories(allCategories);
            }, (err) => console.error("Error loading categories:", err));

            // 4. പ്രൊഡക്ടുകൾ
            onSnapshot(query(productsRef), (snapshot) => {
                allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderProductFeed(allProducts); // ഹോം പേജ് ഫീഡ്
                renderProductGrid(allProducts); // പ്രൊഡക്റ്റ്സ് പേജ് ഗ്രിഡ്
            }, (err) => console.error("Error loading products:", err));
        }

        // --- RENDER FUNCTIONS ---

        // 1. ഹെഡർ, ഫൂട്ടർ, കറൻസി
        function renderContent(data) {
            document.title = data.headerTitle || "SocialShop";
            $headerTitle.textContent = data.headerTitle || "SocialShop";
            $footerText.innerHTML = data.footerText || "&copy; 2025 SocialShop. All rights reserved.";
            
            if (data.headerIconUrl) {
                $headerIconImg.src = data.headerIconUrl;
            } else {
                $headerIconImg.src = 'https://placehold.co/40x40/6366F1/FFFFFF?text=S'; // Default
            }

            currencySymbol = data.currencySymbol || '₹'; // Default to Rupee
            // ഡാറ്റ മാറുമ്പോൾ പ്രൊഡക്ടുകൾ വീണ്ടും റെൻഡർ ചെയ്യുന്നു
            renderProductFeed(allProducts);
            renderProductGrid(allProducts);
        }

        // 2. തീം നിറങ്ങളും ഫോണ്ടും പ്രയോഗിക്കുന്നു
        function applyTheme(data) {
            const root = document.documentElement;
            const primary = data.primaryColor || '#6366F1'; // Default to Indigo
            
            root.style.setProperty('--color-primary-50', hexToRgba(primary, 0.05));
            root.style.setProperty('--color-primary-100', hexToRgba(primary, 0.1));
            root.style.setProperty('--color-primary-500', primary);
            root.style.setProperty('--color-primary-600', darkenHex(primary, 10));
            root.style.setProperty('--color-primary-700', darkenHex(primary, 20));
            
            const font = data.fontFamily || 'Inter';
            root.style.setProperty('--font-family', `${font}, sans-serif`);
        }

        // 3. കാറ്റഗറി ഫിൽറ്ററുകൾ (പ്രൊഡക്റ്റ്സ് പേജ്)
        function renderCategories(categories) {
            $categoryFilters.innerHTML = '';
            
            const allBtn = document.createElement('button');
            allBtn.className = "category-filter-btn bg-primary-600 text-white py-2 px-4 rounded-full font-medium text-sm shadow-sm flex-shrink-0";
            allBtn.textContent = 'All Products';
            allBtn.dataset.categoryId = 'all';
            allBtn.onclick = () => filterProducts('all', allBtn);
            $categoryFilters.appendChild(allBtn);

            categories.sort((a, b) => a.name.localeCompare(b.name)).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "category-filter-btn bg-white text-gray-700 hover:bg-gray-50 py-2 px-4 rounded-full font-medium text-sm shadow-sm flex-shrink-0";
                btn.textContent = cat.name;
                btn.dataset.categoryId = cat.id;
                btn.onclick = () => filterProducts(cat.id, btn);
                $categoryFilters.appendChild(btn);
            });
        }

        // 4. പ്രൊഡക്റ്റ് ഫീഡ് (ഹോം പേജ്)
        function renderProductFeed(productsToRender) {
            $productFeed.innerHTML = '';
            if (productsToRender.length === 0) {
                $productFeed.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No products found.</p>`;
                return;
            }

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = "product-feed-card bg-white rounded-lg shadow-md overflow-hidden";
                
                // വില കണക്കുകൂട്ടലുകൾ (സ്ക്രീൻഷോട്ട് പോലെ)
                const price = parseFloat(product.price || 0);
                const originalPrice = price * 1.25; // ഒരു 20-25% ഡിസ്കൗണ്ട് കാണിക്കാൻ
                const discount = Math.round(((originalPrice - price) / originalPrice) * 100);

                card.innerHTML = `
                    <div class="p-3 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <img class="h-8 w-8 rounded-full object-cover" src="https://placehold.co/40x40/9CA3AF/FFFFFF?text=S" alt="Seller">
                            <span class="font-semibold text-sm text-gray-800">${product.sellerName || 'SANJIDE'}</span>
                        </div>
                        <button class="text-gray-400 hover:text-gray-600">
                            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM10 8.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM11.5 15.5a1.5 1.5 0 10-3 0 1.5 1.5 0 003 0z" />
                            </svg>
                        </button>
                    </div>
                    <div>
                        <img class="w-full h-auto" src="${product.imageUrl || 'https://placehold.co/600x400'}" alt="${product.name}" onerror="this.src='https://placehold.co/600x400'">
                    </div>
                    <div class="p-4">
                        <div class="flex items-center space-x-4 mb-2">
                            <button class="flex items-center space-x-1">
                                <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                                </svg>
                                <span class="text-sm font-medium text-gray-600">0</span>
                            </button>
                            <button class="flex items-center space-x-1">
                                <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 011.037-.443h2.884c1.584 0 2.863-1.279 2.863-2.863V13.177c0-1.6-1.123-2.994-2.707-3.227A48.214 48.214 0 0012 9.75c-1.087 0-2.185-.06-3.293-.182a3.003 3.003 0 00-2.707 3.228z" />
                                </svg>
                                <span class="text-sm font-medium text-gray-600">0</span>
                            </button>
                        </div>
                        <p class="font-semibold text-gray-800">${product.name || 'Untitled Product'}</p>
                        <div class="flex items-center space-x-2 mt-1">
                            <span class="text-lg font-bold text-gray-900">${currencySymbol}${price.toFixed(2)}</span>
                            <span class="text-sm text-gray-500 line-through">${currencySymbol}${originalPrice.toFixed(2)}</span>
                            <span class="text-sm font-semibold text-red-500">(${discount}% Off)</span>
                        </div>
                    </div>
                `;
                $productFeed.appendChild(card);
            });
        }
        
        // 5. പ്രൊഡക്റ്റ് ഗ്രിഡ് (പ്രൊഡക്റ്റ്സ് പേജ്)
        function renderProductGrid(productsToRender) {
            $productList.innerHTML = '';
            if (productsToRender.length === 0) {
                $productList.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No products found.</p>`;
                return;
            }

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = "product-grid-card bg-white rounded-lg shadow-md overflow-hidden flex flex-col";
                
                const price = parseFloat(product.price || 0);
                const originalPrice = price * 1.25; // ഡിസ്കൗണ്ട് കാണിക്കാൻ
                const discount = Math.round(((originalPrice - price) / originalPrice) * 100);

                card.innerHTML = `
                    <div class="relative">
                        <img class="h-40 w-full object-cover" src="${product.imageUrl || 'https://placehold.co/300x300'}" alt="${product.name}" onerror="this.src='https://placehold.co/300x300'">
                        <span class="absolute top-2 left-2 text-white price-tag">${currencySymbol}${originalPrice.toFixed(0)}</span>
                    </div>
                    <div class="p-3 flex flex-col flex-grow">
                        <span class="text-xs font-semibold text-gray-500 uppercase mb-1">${product.sellerName || 'SANJIDE'}</span>
                        <h3 class="text-sm font-semibold text-gray-800 mb-2 flex-grow">${product.name || 'Untitled Product'}</h3>
                        <div class="flex items-center space-x-2 mb-3">
                            <span class="text-base font-bold text-gray-900">${currencySymbol}${price.toFixed(2)}</span>
                            <span class="text-xs text-gray-500 line-through">${currencySymbol}${originalPrice.toFixed(2)}</span>
                            <span class="text-xs font-semibold text-red-500">(${discount}% Off)</span>
                        </div>
                        <button class="chat-btn w-full text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center space-x-1.5">
                            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.0-5.525 4.479-10 10.001-10 2.725 0 5.187.986 7.043 2.582l-1.6 1.6c-1.56-1.32-3.518-2.18-5.743-2.18-4.563 0-8.261 3.7-8.261 8.261 0 1.96.65 3.77 1.77 5.17l-1.17 4.249 4.33-1.13c1.36.93 3.02 1.48 4.79 1.48 4.561 0 8.26-3.7 8.26-8.261 0-1.42-.36-2.76-.99-3.93l1.6-1.6c.9 1.52 1.4 3.28 1.4 5.13 0 5.525-4.479 10-10.001 10-2.16 0-4.2-.68-5.9-1.85l-6.163 1.687z"/></svg>
                            <span>Chat</span>
                        </button>
                    </div>
                `;
                $productList.appendChild(card);
            });
        }

        // 6. പ്രൊഡക്ടുകൾ ഫിൽറ്റർ ചെയ്യുന്നു (പ്രൊഡക്റ്റ്സ് പേജ്)
        function filterProducts(categoryId, activeBtn) {
            document.querySelectorAll('.category-filter-btn').forEach(btn => {
                btn.classList.remove('bg-primary-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700', 'hover:bg-gray-50');
            });
            activeBtn.classList.add('bg-primary-600', 'text-white');
            activeBtn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-50');

            const filtered = (categoryId === 'all')
                ? allProducts
                : allProducts.filter(p => p.categoryId === categoryId);
            
            renderProductGrid(filtered); // ഗ്രിഡ് മാത്രം അപ്ഡേറ്റ് ചെയ്യുന്നു
        }

        // 7. അക്കൗണ്ട് പേജ് റെൻഡർ ചെയ്യുന്നു
        function renderAccountPage() {
            // ഡിഫോൾട്ടായി 'About Us' കാണിക്കുന്നു
            updateInfoContent('About Us', appContent.aboutUs);
        }

        // അക്കൗണ്ട് പേജിലെ കണ്ടന്റ് മാറ്റുന്നു
        function updateInfoContent(title, content) {
            $infoContentTitle.textContent = title;
            if (content) {
                $infoContentBody.innerHTML = content.replace(/\n/g, '<br>'); // Newlines to <br>
            } else {
                $infoContentBody.innerHTML = `<p class="text-gray-500">Content not available. Admin needs to update this section.</p>`;
            }
        }


        // --- NAVIGATION ---
        function showPage(pageId) {
            Object.values($pages).forEach(page => {
                page.classList.add('hidden');
            });
            $pages[pageId].classList.remove('hidden');

            // ബോട്ടം നാവിഗേഷനിലെ ആക്റ്റീവ് സ്റ്റേറ്റ് മാറ്റുന്നു
            $navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === pageId) {
                    link.classList.add('active');
                }
            });
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // ബോട്ടം നാവിഗേഷൻ ക്ലിക്കുകൾ
            $navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const pageId = link.dataset.page;
                    showPage(pageId);
                });
            });

            // അക്കൗണ്ട് പേജ് ലിങ്ക് ക്ലിക്കുകൾ
            $infoLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const contentId = link.id;
                    if (contentId === 'infoLinkAbout') {
                        updateInfoContent('About Us', appContent.aboutUs);
                    } else if (contentId === 'infoLinkTerms') {
                        updateInfoContent('Terms & Conditions', appContent.termsAndConditions);
                    } else if (contentId === 'infoLinkCopyright') {
                        updateInfoContent('Copyright', appContent.copyright);
                    }
                });
            });

            // സെർച്ച് (തൽക്കാലം ലളിതമായി)
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = allProducts.filter(p => 
                    p.name.toLowerCase().includes(searchTerm)
                );
                renderProductFeed(filtered);
                // പ്രൊഡക്റ്റ് പേജിലും ഇത് ചെയ്യണമെങ്കിൽ:
                // renderProductGrid(filtered); 
            });
        }

        // --- UTILITY FUNCTIONS ---
        function showMessage(message, type = 'info') {
            $messageText.textContent = message;
            $messageBox.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'bg-blue-500');
            
            if (type === 'success') $messageBox.classList.add('bg-green-500');
            else if (type === 'error') $messageBox.classList.add('bg-red-500');
            else $messageBox.classList.add('bg-blue-500');

            setTimeout(() => { $messageBox.classList.add('hidden'); }, 3000);
        }

        function hexToRgba(hex, alpha) {
            let r = 0, g = 0, b = 0;
            if (!hex || hex.length < 4) hex = '#6366F1'; // Default
            if (hex.length == 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length == 7) {
                r = parseInt(hex.substring(1, 3), 16);
                g = parseInt(hex.substring(3, 5), 16);
                b = parseInt(hex.substring(5, 7), 16);
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function darkenHex(hex, percent) {
            if (!hex || hex.length < 4) hex = '#6366F1'; // Default
            let r = parseInt(hex.substring(1, 3), 16);
            let g = parseInt(hex.substring(3, 5), 16);
            let b = parseInt(hex.substring(5, 7), 16);
            r = Math.floor(r * (100 - percent) / 100);
            g = Math.floor(g * (100 - percent) / 100);
            b = Math.floor(b * (100 - percent) / 100);
            r = (r < 0) ? 0 : r;
            g = (g < 0) ? 0 : g;
            b = (b < 0) ? 0 : b;
            return `#${(r.toString(16).padStart(2, '0'))}${(g.toString(16).padStart(2, '0'))}${(b.toString(16).padStart(2, '0'))}`;
        }

        // --- STARTUP ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebase();
            setupEventListeners();
            showPage('pageHome'); // ഹോം പേജ് ആദ്യം കാണിക്കുന്നു
        });

    </script>

</body>
